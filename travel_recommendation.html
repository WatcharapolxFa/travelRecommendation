<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Recommendation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; color: #fff; }

    nav {
      position: fixed; top: 0; width: 100%; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 14px 32px; background: rgba(10, 30, 50, 0.85);
    }
    .logo { font-size: 20px; font-weight: bold; margin-right: auto; }
    nav a { color: #fff; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    nav input { padding: 8px 12px; border: none; border-radius: 4px; width: 260px; }
    nav button {
      padding: 8px 16px; border: none; border-radius: 4px;
      background: #1f8a9e; color: #fff; cursor: pointer;
    }

    .home {
      min-height: 100vh;
      display: flex; align-items: center; gap: 40px;
      padding: 80px 64px 32px;
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
                  url("https://picsum.photos/id/1015/1600/900") center / cover;
    }
    .home-text { flex: 1; }
    .home h1 { font-size: 52px; max-width: 640px; }
    .home p { font-size: 18px; max-width: 560px; margin: 16px 0 24px; line-height: 1.5; }
    .book-now {
      width: fit-content; padding: 12px 28px; border: none; border-radius: 4px;
      background: #1f8a9e; color: #fff; font-size: 16px; cursor: pointer;
    }
    .social { display: flex; gap: 18px; margin-top: 32px; font-size: 24px; }
    .social a { color: #fff; }

    #results {
      flex: 1; display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      align-content: start;
      max-height: calc(100vh - 120px); overflow-y: auto;
    }
    .card { background: #fff; color: #222; border-radius: 10px; overflow: hidden; }
    .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card-body { padding: 14px; }
    .card h3 { margin-bottom: 8px; }
    .card p { font-size: 14px; max-width: none; margin: 0 0 10px; line-height: 1.4; }
    .card .local-time { font-weight: bold; color: #1f8a9e; }
    .card button {
      padding: 8px 18px; border: none; border-radius: 4px;
      background: #1f8a9e; color: #fff; cursor: pointer;
    }
    .no-results { font-size: 18px; }

    @media (max-width: 800px) {
      .home { flex-direction: column; justify-content: center; padding: 100px 24px 32px; }
      #results { max-height: none; width: 100%; }
    }
  </style>
</head>
<body>
  <nav>
    <span class="logo">Travel Recommendation</span>

    <a href="travel_recommendation.html">Home</a>
    <a href="about_us.html">About Us</a>
    <a href="contact_us.html">Contact Us</a>

    <input type="text" id="searchInput" placeholder="Enter a destination or keyword">
    <button id="btnSearch">Search</button>
    <button id="btnClear">Clear</button>
  </nav>

  <section class="home">
    <div class="home-text">
    <h1>Explore Dream Destinations</h1>
    <p>Discover beaches, ancient temples and vibrant cities around the world.
       Experience new cultures, taste local food and make memories that last a lifetime.</p>
    <button class="book-now">Book Now</button>

    <div class="social">
      <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
      <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
    </div>
    </div>

    <div id="results"></div>
  </section>

  <script src="travel_recommendation.js"></script>
</body>
</html>
