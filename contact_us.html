<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; color: #fff; background: #0f2a3a; }

    nav {
      position: fixed; top: 0; width: 100%; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 14px 32px; background: rgba(10, 30, 50, 0.85);
    }
    .logo { font-size: 20px; font-weight: bold; margin-right: auto; }
    nav a { color: #fff; text-decoration: none; }
    nav a:hover { text-decoration: underline; }

    main { padding: 100px 24px 64px; text-align: center; }
    h1 { font-size: 42px; margin-bottom: 12px; }
    .info { font-size: 18px; margin-bottom: 32px; }

    form {
      max-width: 480px; margin: 0 auto; padding: 28px; text-align: left;
      border-radius: 8px; background: rgba(255, 255, 255, 0.06); border-top: 4px solid #1f8a9e;
    }
    label { display: block; margin-bottom: 6px; }
    input, textarea {
      width: 100%; padding: 10px 12px; margin-bottom: 18px;
      border: none; border-radius: 4px; font-family: inherit; font-size: 15px;
    }
    textarea { height: 120px; resize: vertical; }
    button {
      padding: 10px 28px; border: none; border-radius: 4px;
      background: #1f8a9e; color: #fff; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <nav>
    <span class="logo">Travel Recommendation</span>

    <a href="travel_recommendation.html">Home</a>
    <a href="about_us.html">About Us</a>
    <a href="contact_us.html">Contact Us</a>
  </nav>

  <main>
    <h1>Contact Us</h1>
    <p class="info">Email us at info@travelrecommendation.com or call +1 555 0123.</p>

    <form id="contactForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Thank you for contacting us!");
      this.reset();
    });
  </script>
</body>
</html>
